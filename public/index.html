<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MASTER AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#04090d;color:#e9fffb;font-family:Arial,sans-serif}
header{height:70px;border-bottom:1px solid #17313a;display:flex;align-items:center;padding:0 22px;font-weight:800;letter-spacing:3px}
.logo{width:40px;height:40px;border:1px solid #39f6e0;border-radius:12px;display:grid;place-items:center;color:#39f6e0;margin-right:12px}
main{max-width:850px;margin:auto;padding:18px}.hero{text-align:center;padding:30px 10px}.hero h1{letter-spacing:4px}
.core{width:230px;height:230px;border-radius:50%;margin:20px auto 55px;border:1px solid #39f6e0;display:grid;place-items:center;box-shadow:0 0 45px #0b6f6b;position:relative}
.core:after{content:"";position:absolute;inset:25px;border:1px dashed #39f6e0;border-radius:50%;animation:spin 8s linear infinite}
.orb{width:105px;height:105px;border-radius:50%;background:radial-gradient(circle,#fff,#39f6e0 8%,#08706c 35%,transparent 70%);box-shadow:0 0 35px #39f6e0;animation:pulse 2s infinite}
.active{color:#39f6e0;font-weight:bold;letter-spacing:2px}.status{color:#7dff9b;font-size:12px}
.panel{border:1px solid #17313a;border-radius:14px;background:#081117;overflow:hidden}
.messages{height:330px;overflow:auto;padding:14px}.msg{padding:11px 13px;border-radius:10px;margin:8px 0;max-width:85%;line-height:1.5}
.ai{background:#0b1c21}.user{background:#10382f;margin-left:auto}
..bar{
display:flex;
align-items:center;
gap:6px;
padding:8px;
border-top:1px solid #17313a;
}

.bar input{
flex:1;
min-width:0;
padding:12px;
border-radius:22px;
border:1px solid #277b8b;
background:#050b10;
color:#fff;
outline:none;
}

.bar button{
width:42px;
height:42px;
border-radius:50%;
border:1px solid #277b8b;
background:#0d3939;
color:#39f6e0;
font-size:18px;
cursor:pointer;
 }.bar input{flex:1;background:#050b10;border:1px solid #17313a;color:white;border-radius:10px;padding:13px;outline:none}
.bar button{background:#0d3939;color:#39f6e0;border:1px solid #277b7b;border-radius:10px;padding:0 18px;cursor:pointer}
.note{color:#78949a;text-align:center;font-size:12px;margin:18px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.08)}}
html,body{
width:100%;
height:100%;
margin:0;
overflow:hidden;
}

body{
background:#04090d;
}

header{
height:56px;
}

main{
width:100%;
height:calc(100vh - 56px);
margin:0;
padding:0;
}

.hero{
display:none;
}

.panel{
width:100%;
height:100%;
margin:0;
border:0;
border-radius:0;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
height:auto;
overflow-y:auto;
padding:14px;
}

.bar{
flex-shrink:0;
 }
 .bar{
position:fixed;
left:0;
right:0;
bottom:0;
height:64px;
box-sizing:border-box;
display:flex;
align-items:center;
gap:8px;
padding:8px 12px;
background:#04090d;
border-top:1px solid #17313a;
z-index:1000;
}

.bar input{
flex:1;
min-width:0;
height:44px;
box-sizing:border-box;
padding:0 16px;
border-radius:24px;
border:1px solid #277b8b;
background:#081217;
color:#fff;
font-size:15px;
outline:none;
}

.bar button{
border:0;
background:transparent;
color:#b9c8cc;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.plus-btn{
font-size:28px;
width:34px;
height:44px;
}

.voice-btn{
width:42px;
height:44px;
}

.voice-btn svg{
width:27px;
height:21px;
fill:none;
stroke:#b9c8cc;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
}

.send-btn{
width:38px;
height:38px;
border-radius:50% !important;
background:#19d3c5 !important;
color:#031014 !important;
font-size:19px;
font-weight:bold;
       }
</style>
</head>
<body>
<header><div class="logo">M</div>MASTER AI</header>>
<main>
<div class="hero"><h1>AZAM AI</h1><div class="status">● SYSTEM ONLINE</div>
<div class="core"><div class="orb"></div></div>
<div class="active">CORE ACTIVE</div><div style="color:#78949a;margin-top:8px">AI PROCESSING READY</div></div>
<div class="panel">
<div id="messages" class="messages"><div class="msg ai">MASTER AI online. Ask me anything.</div></div>
<div class="bar">

<button class="plus-btn" onclick="document.getElementById('fileInput').click()">＋</button>

<input
id="input"
placeholder="Message MASTER AI..."
onkeydown="if(event.key==='Enter')send()"
>

<button class="voice-btn" onclick="startVoice()" aria-label="Voice">
<svg viewBox="0 0 24 24">
<path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/>
<path d="M19 11a7 7 0 0 1-14 0"/>
<path d="M12 18v3"/>
</svg>
</button>

<button class="send-btn" onclick="send()">➤</button>

<input
id="fileInput"
type="file"
accept="image/*,video/*,.pdf,.txt,.doc,.docx"
style="display:none"
onchange="fileSelected(this)"
>

</div>
</div>
<div class="note">Real AI mode • Keep your API key on the server, never in this page.</div>
</main>
<script>
async function send(){
 const input=document.getElementById("input"), text=input.value.trim(); if(!text)return;
 const box=document.getElementById("messages");
 const u=document.createElement("div"); u.className="msg user"; u.textContent=text; box.appendChild(u);
 input.value="";
 const loading=document.createElement("div"); loading.className="msg ai"; loading.textContent="Thinking..."; box.appendChild(loading);
 box.scrollTop=box.scrollHeight;
 try{
   const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text})});
   const d=await r.json(); loading.textContent=d.reply||"No response.";
speak(d.reply);
 }catch(e){loading.textContent="Could not connect to AZAM AI server."}
 box.scrollTop=box.scrollHeight;
}
 let voiceRecognition = null;
let voiceMode = false;
let waitingForReply = false;

function startVoice(){
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Voice input is not supported on this browser.");
    return;
  }

  voiceMode = true;

  if (voiceRecognition) {
    try { voiceRecognition.stop(); } catch(e) {}
  }

  voiceRecognition = new SpeechRecognition();
  voiceRecognition.lang = "ur-PK";
  voiceRecognition.continuous = true;
  voiceRecognition.interimResults = false;

  voiceRecognition.onresult = function(event){
    let text = "";

    for(let i = event.resultIndex; i < event.results.length; i++){
      if(event.results[i].isFinal){
        text += event.results[i][0].transcript + " ";
      }
    }

    text = text.trim();

    if(text){
      waitingForReply = true;

      try { voiceRecognition.stop(); } catch(e) {}

      document.getElementById("input").value = text;
      send();
    }
  };

  voiceRecognition.onend = function(){
    if(voiceMode && !waitingForReply){
      setTimeout(() => startVoice(), 300);
    }
  };

  voiceRecognition.start();
 }
 function speak(text){
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = "ur-PK";
  voice.rate = 1;
  voice.pitch = 1;
  voice.volume = 1;

  voice.onend = function(){
    waitconstingForReply = false;

    if(voiceMode){
      setTimeout(() => startVoice(), 300);
    }
  };

  window.speechSynthesis.speak(voice);
 }
 async function fileSelected(input){
  const file = input.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")){
    alert("Abhi AZAM AI mein photo upload active hai. Video aur files next step mein add karenge.");
    input.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = async function(){
    const image = reader.result;
    const box = document.getElementById("messages");

    const u = document.createElement("div");
    u.className = "msg user";
    u.textContent = "📷 Photo: " + file.name;
    box.appendChild(u);

    const loading = document.createElement("div");
    loading.className = "msg ai";
    loading.textContent = "Photo dekh raha hoon...";
    box.appendChild(loading);

    box.scrollTop = box.scrollHeight;

    try{
      const r = await fetch("/api/chat", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          message:"Is photo ko dekho aur mujhe batao is mein kya hai.",
          image:image
        })
      });

      const d = await r.json();
      loading.textContent = d.reply || "No response.";

      speak(d.reply);

    }catch(e){
      loading.textContent = "Photo process nahi ho saki.";
    }

    box.scrollTop = box.scrollHeight;
  };

  reader.readAsDataURL(file);
  input.value = "";
}
</script>
</body></html>
