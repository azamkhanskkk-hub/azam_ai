<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MASTER AI</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#080808;
color:#ececec;
}

button,input{font:inherit}

.app{
display:flex;
width:100%;
height:100%;
}

.sidebar{
position:fixed;
z-index:20;
left:-290px;
top:0;
bottom:0;
width:280px;
background:#111;
border-right:1px solid #292929;
padding:12px;
transition:.25s;
overflow-y:auto;
}

.sidebar.open{left:0}

.new-chat{
width:100%;
padding:13px;
border:1px solid #333;
border-radius:10px;
background:#181818;
color:white;
text-align:left;
cursor:pointer;
margin-bottom:12px;
}

.history-item{
display:flex;
align-items:center;
gap:7px;
padding:10px;
border-radius:9px;
cursor:pointer;
color:#ddd;
font-size:14px;
}

.history-item:hover{
background:#222;
}

.history-title{
flex:1;
overflow:hidden;
white-space:nowrap;
text-overflow:ellipsis;
}

.delete-chat{
background:transparent;
border:0;
color:#888;
cursor:pointer;
}

.main{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}

.topbar{
height:58px;
flex-shrink:0;
display:flex;
align-items:center;
gap:10px;
padding:0 12px;
border-bottom:1px solid #292929;
background:#0b0b0b;
}

.menu{
width:40px;
height:40px;
border:0;
border-radius:9px;
background:#171717;
color:#fff;
font-size:23px;
cursor:pointer;
}

.logo{
width:36px;
height:36px;
border:1px solid #28d9c8;
border-radius:10px;
display:grid;
place-items:center;
color:#28d9c8;
font-weight:bold;
}

.title{
font-weight:bold;
letter-spacing:2px;
}

.status{
margin-left:auto;
font-size:11px;
color:#67e8d9;
}

.chat{
flex:1;
overflow-y:auto;
padding:18px 12px 90px;
}

.welcome{
max-width:720px;
margin:35px auto;
text-align:center;
}

.welcome h1{
font-size:32px;
margin:0 0 10px;
letter-spacing:3px;
}

.welcome p{
color:#999;
}

.message{
display:flex;
margin:12px auto;
max-width:820px;
}

.message.user{
justify-content:flex-end;
}

.bubble{
max-width:85%;
padding:12px 15px;
border-radius:16px;
line-height:1.55;
white-space:pre-wrap;
word-wrap:break-word;
}

.ai .bubble{
background:#171717;
border:1px solid #242424;
}

.user .bubble{
background:#174b43;
}

.message-actions{
display:flex;
gap:5px;
margin-top:5px;
}

.message-actions button{
background:transparent;
border:0;
color:#888;
font-size:12px;
cursor:pointer;
}

.composer{
position:fixed;
left:0;
right:0;
bottom:0;
z-index:10;
padding:8px 10px;
background:linear-gradient(transparent,#080808 18%);
}

.composer-inner{
max-width:850px;
margin:auto;
display:flex;
align-items:center;
gap:7px;
padding:7px;
background:#171717;
border:1px solid #383838;
border-radius:26px;
}

.icon-btn{
width:38px;
height:38px;
flex-shrink:0;
border:0;
border-radius:50%;
background:transparent;
color:#ccc;
cursor:pointer;
display:grid;
place-items:center;
font-size:22px;
}

.icon-btn:hover{
background:#252525;
}

.text-input{
flex:1;
min-width:0;
height:40px;
border:0;
outline:0;
background:transparent;
color:#fff;
font-size:15px;
}

.text-input::placeholder{
color:#888;
}

.send{
width:38px;
height:38px;
border:0;
border-radius:50%;
background:#20d3c4;
color:#001412;
font-size:19px;
font-weight:bold;
cursor:pointer;
}

.voice-btn svg{
width:23px;
height:23px;
fill:none;
stroke:#ccc;
stroke-width:1.8;
stroke-linecap:round;
stroke-linejoin:round;
}

.send:disabled{
opacity:.35;
}

.settings{
position:fixed;
z-index:30;
right:12px;
top:65px;
width:250px;
background:#151515;
border:1px solid #333;
border-radius:13px;
padding:14px;
display:none;
box-shadow:0 15px 40px #000;
}

.settings.show{
display:block;
}

.settings h3{
margin:0 0 14px;
}

.setting-row{
padding:11px 0;
border-bottom:1px solid #292929;
color:#ccc;
font-size:14px;
}

.setting-row:last-child{
border:0;
}

.close{
float:right;
background:transparent;
border:0;
color:#aaa;
font-size:20px;
}

.overlay{
display:none;
position:fixed;
inset:0;
z-index:15;
background:#0008;
}

.overlay.show{
display:block;
}

.typing{
opacity:.6;
}

@media(min-width:800px){
.sidebar{
position:relative;
left:0;
}

.overlay{
display:none!important;
}

.main{
width:calc(100% - 280px);
}

.menu{
display:none;
}
}
</style>
</head>

<body>

<div class="app">

<div id="overlay" class="overlay" onclick="closeSidebar()"></div>

<aside id="sidebar" class="sidebar">

<button class="new-chat" onclick="newChat()">＋ New chat</button>

<div id="history"></div>

</aside>

<section class="main">

<header class="topbar">

<button class="menu" onclick="toggleSidebar()">☰</button>

<div class="logo">M</div>

<div class="title">MASTER AI</div>

<div class="status">● ONLINE</div>

<button class="icon-btn" onclick="toggleSettings()">⚙</button>

</header>

<main id="chat" class="chat">

<div class="welcome" id="welcome">
<h1>MASTER AI</h1>
<p>Your intelligent AI assistant.</p>
</div>

</main>

<div id="settings" class="settings">

<button class="close" onclick="toggleSettings()">×</button>

<h3>Settings</h3>

<div class="setting-row">
Master AI
</div>

<div class="setting-row">
Voice replies: ON
</div>

<div class="setting-row">
Language: Urdu / English
</div>

<div class="setting-row" onclick="clearAllChats()" style="cursor:pointer;color:#ff7777">
Clear all chats
</div>

</div>

<div class="composer">

<div class="composer-inner">

<button class="icon-btn"
onclick="document.getElementById('fileInput').click()">
＋
</button>

<input
id="input"
class="text-input"
placeholder="Message MASTER AI..."
autocomplete="off"
>

<button class="icon-btn voice-btn"
onclick="startVoice()"
aria-label="Voice">

<svg viewBox="0 0 24 24">
<path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"/>
<path d="M19 11a7 7 0 0 1-14 0"/>
<path d="M12 18v3"/>
</svg>

</button>

<button id="sendBtn" class="send" onclick="send()">➤</button>

<input
id="fileInput"
type="file"
accept="image/*,video/*,.pdf,.txt,.doc,.docx"
style="display:none"
onchange="fileSelected(this)"
>

</div>

</div>

</section>

</div>

<script>

let chats=[];
let currentChat=null;

let voiceRecognition=null;
let voiceMode=false;
let waitingForReply=false;
let selectedImage=null;
  const photoPreview=document.createElement("div");

photoPreview.style.display="none";
photoPreview.style.padding="8px";
photoPreview.style.position="fixed";
photoPreview.style.bottom="70px";
photoPreview.style.left="10px";
photoPreview.style.zIndex="9";
photoPreview.style.background="#171717";
photoPreview.style.border="1px solid #333";
photoPreview.style.borderRadius="12px";

document.body.appendChild(photoPreview);
const chatBox=document.getElementById("chat");
const input=document.getElementById("input");

function loadChats(){

try{
chats=JSON.parse(localStorage.getItem("master_ai_chats")||"[]");
}catch(e){
chats=[];
}

if(chats.length===0){
newChat();
}else{
currentChat=chats[0].id;
renderHistory();
renderChat();
}

}

function saveChats(){
localStorage.setItem("master_ai_chats",JSON.stringify(chats));
}

function newChat(){

const chat={
id:Date.now(),
title:"New chat",
messages:[]
};

chats.unshift(chat);
currentChat=chat.id;

saveChats();
renderHistory();
renderChat();

closeSidebar();

input.focus();

}

function current(){

return chats.find(x=>x.id===currentChat);

}

function renderHistory(){

const box=document.getElementById("history");
box.innerHTML="";

chats.forEach(c=>{

const row=document.createElement("div");
row.className="history-item";

const title=document.createElement("div");
title.className="history-title";
title.textContent=c.title;

title.onclick=()=>{
currentChat=c.id;
renderHistory();
renderChat();
closeSidebar();
};

const del=document.createElement("button");
del.className="delete-chat";
del.textContent="×";

del.onclick=(e)=>{
e.stopPropagation();

chats=chats.filter(x=>x.id!==c.id);

if(!chats.length){
newChat();
return;
}

if(currentChat===c.id){
currentChat=chats[0].id;
}

saveChats();
renderHistory();
renderChat();

};

row.appendChild(title);
row.appendChild(del);

box.appendChild(row);

});

}

function renderChat(){

chatBox.innerHTML="";

const c=current();

if(!c || !c.messages.length){

const welcome=document.createElement("div");
welcome.className="welcome";
welcome.innerHTML="<h1>MASTER AI</h1><p>How can I help you today?</p>";
chatBox.appendChild(welcome);

return;

}

c.messages.forEach(m=>{
addMessage(m.role,m.text,false);
});

scrollBottom();

}

function addMessage(role,text,save=true){

const wrap=document.createElement("div");
wrap.className="message "+(role==="user"?"user":"ai");

const inside=document.createElement("div");

const bubble=document.createElement("div");
bubble.className="bubble";
bubble.textContent=text;

inside.appendChild(bubble);

if(role==="ai"){

const actions=document.createElement("div");
actions.className="message-actions";
const listen=document.createElement("button");
listen.textContent="🔊 Listen";

listen.onclick=()=>{
  const voice=new SpeechSynthesisUtterance(text);
  voice.lang="ur-PK";
  speechSynthesis.speak(voice);
};

actions.appendChild(listen);
const copy=document.createElement("button");
copy.textContent="Copy";
copy.onclick=()=>navigator.clipboard?.writeText(text);

const regen=document.createElement("button");
regen.textContent="Regenerate";
regen.onclick=()=>regenerate();

actions.appendChild(copy);
actions.appendChild(regen);
inside.appendChild(actions);

}

wrap.appendChild(inside);
chatBox.appendChild(wrap);

if(save){

const c=current();

if(c){

c.messages.push({
role:role,
text:text
});

if(role==="user" && c.title==="New chat"){
c.title=text.slice(0,35);
}

saveChats();
renderHistory();

}

}

scrollBottom();

}

function scrollBottom(){

chatBox.scrollTop=chatBox.scrollHeight;

}

async function send(){

const text=input.value.trim();

if(!text && !selectedImage)return;

const image=selectedImage;

input.value="";
selectedImage=null;
input.placeholder="Message MASTER AI...";

input.value="";

addMessage("user",text);

const loading=document.createElement("div");
loading.className="message ai";
loading.id="loading";

const bubble=document.createElement("div");
bubble.className="bubble typing";
bubble.textContent="Thinking...";

loading.appendChild(bubble);
chatBox.appendChild(loading);

scrollBottom();

try{

const r=await fetch(
  image && text ? "/api/edit-image" : "/api/chat",
  {
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text,
image:image
})
});

const d=await r.json();
if (d.image) {
  const img=document.createElement("img");
  img.src="data:image/png;base64,"+d.image;
  img.style.maxWidth="100%";
  img.style.borderRadius="14px";
  img.style.marginTop="8px";
  chatBox.appendChild(img);
  }
loading.remove();

const reply=d.reply||"No response generated.";

addMessage("ai",reply);



}catch(e){

loading.remove();

addMessage("ai","MASTER AI server se connection nahi ho saka.");

}

}

async function regenerate(){

const c=current();

if(!c || !c.messages.length)return;

let lastUser=null;

for(let i=c.messages.length-1;i>=0;i--){

if(c.messages[i].role==="user"){
lastUser=c.messages[i].text;
break;
}

}

if(!lastUser)return;

if(c.messages[c.messages.length-1].role==="ai"){
c.messages.pop();
}

saveChats();
renderChat();

input.value=lastUser;

await send();

}

function toggleSidebar(){

document.getElementById("sidebar").classList.toggle("open");
document.getElementById("overlay").classList.toggle("show");

}

function closeSidebar(){

document.getElementById("sidebar").classList.remove("open");
document.getElementById("overlay").classList.remove("show");

}

function toggleSettings(){

document.getElementById("settings").classList.toggle("show");

}

function clearAllChats(){

if(!confirm("Delete all chats?"))return;

localStorage.removeItem("master_ai_chats");

chats=[];
newChat();

}

function startVoice(){

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Voice input browser mein supported nahi hai.");
return;

}

voiceMode=true;

if(voiceRecognition){

try{
voiceRecognition.stop();
}catch(e){}

}

voiceRecognition=new SpeechRecognition();

voiceRecognition.lang="ur-PK";
voiceRecognition.continuous=false;
voiceRecognition.interimResults=false;

voiceRecognition.onresult=function(event){

const text=event.results[0][0].transcript;

if(text){

waitingForReply=true;

input.value=text;

send();

}

};

voiceRecognition.onend=function(){

if(voiceMode && !waitingForReply){

}

};

voiceRecognition.start();

}

function speak(text){

if(!("speechSynthesis" in window))return;

window.speechSynthesis.cancel();

const voice=new SpeechSynthesisUtterance(text);

voice.lang="ur-PK";
voice.rate=1;
voice.pitch=1;
voice.volume=1;

voice.onend=function(){

waitingForReply=false;

};

window.speechSynthesis.speak(voice);

}

function fileSelected(inputElement){

const file=inputElement.files[0];

if(!file)return;

if(!file.type.startsWith("image/")){
alert("Abhi sirf photos supported hain.");
inputElement.value="";
return;
}

const reader=new FileReader();

reader.onload=function(){

selectedImage=reader.result;

input.placeholder="Photo ke baare mein kya karna hai?";

};

reader.readAsDataURL(file);

inputElement.value="";

 }

input.addEventListener("keydown",function(e){

if(e.key==="Enter"){

e.preventDefault();
send();

}

});

loadChats();

</script>

</body>
 </html>
